<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOVELLE | 404 Not Found</title>
  <link rel="stylesheet" href="../assets/css/main.css">

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body style="background-color: var(--color-plum); color: var(--color-porcelain);">

  <main style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; position: relative;">
    <!-- Background element -->
    <div style="position: absolute; font-family: var(--font-editorial); font-size: 40vw; opacity: 0.05; user-select: none; z-index: 0; white-space: nowrap;" class="float">404</div>
    
    <div style="position: relative; z-index: 1;" class="reveal">
        <p class="text-overline mb-2" style="color: var(--color-champagne);">Page Not Found</p>
        <h1 class="text-h1 mb-4" style="font-family: var(--font-editorial);">Lost in Translation</h1>
        <p class="text-subtitle" style="margin-bottom: 3rem; max-width: 400px; margin-inline: auto; color: rgba(247,243,238,0.7);">The page you are looking for has been moved, removed, or never existed.</p>
        
        <div class="flex justify-center gap-sm">
            <a href="../index.html" class="btn btn-light">Return to Boutique</a>
            <a href="contact.html" class="btn btn-outline" style="color: var(--color-porcelain); border-color: var(--color-porcelain);">Contact Concierge</a>
        </div>
    </div>
  </main>

  <script src="../assets/js/bundle.js"></script>
</body>
</html>
