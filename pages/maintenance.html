<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOVELLE | Site Maintenance</title>
  <link rel="stylesheet" href="../assets/css/main.css">

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body style="background-color: var(--color-ink); color: white;">

  <main class="relative" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-LF8gK8-HGSg?w=1600&q=80" alt="Maintenance" class="w-full h-full object-cover" style="opacity: 0.3; filter: grayscale(100%);">
    </div>

    <div class="container text-center relative z-normal reveal">
        <div class="nav-brand mb-4" style="color: white;">ZOVELLE</div>
        <h1 class="text-h2 mb-2" style="font-family: var(--font-editorial);">Curating the Next Chapter</h1>
        <p class="text-subtitle" style="max-width: 500px; margin: 0 auto 3rem; color: rgba(255,255,255,0.7);">Our digital boutique is temporarily closed as we prepare the new Fall/Winter collection. We will return shortly.</p>
        
        <p class="text-overline mb-2" style="color: var(--color-champagne);">Notify me upon return</p>
        <div class="flex justify-center gap-sm" style="max-width: 400px; margin: 0 auto;">
            <input type="email" placeholder="Email Address" class="input-field" style="color: white; border-bottom-color: rgba(255,255,255,0.3); flex: 1;">
            <button class="btn btn-outline" style="color: var(--color-champagne); border-color: var(--color-champagne);">Submit</button>
        </div>
    </div>

  </main>

  <script src="../assets/js/bundle.js"></script>
</body>
</html>
